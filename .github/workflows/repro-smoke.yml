name: Reproducibility reconstruction smoke tests

on:
  push:
    branches:
      - reproducibility-v1.0.2-review
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute synthetic and MAT-loader tests
        run: python -m pytest -q tests
      - name: Check command-line entry points
        run: |
          python reproducibility/build_manifest.py --help
          python reproducibility/emg_reimplementation.py --help
          python reproducibility/compare_frozen_results.py --help
