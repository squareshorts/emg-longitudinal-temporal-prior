name: Verify archived GRASP overhaul results

on:
  pull_request:
    paths:
      - 'overhaul/**'
      - '.github/workflows/overhaul-archive-audit.yml'
  push:
    branches:
      - overhaul-full-grasp
    paths:
      - 'overhaul/**'
      - '.github/workflows/overhaul-archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archived-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r overhaul/requirements.txt
          python -m pip install pytest
      - name: Audit archived analysis outputs
        run: python overhaul/verify_archived_results.py
      - name: Test synthetic cases
        run: python -m pytest -q overhaul/tests
      - name: Clarify audit scope
        run: |
          echo 'Archived CSVs, code SHA-256, scoring and participant aggregations checked.'
          echo 'Raw 6,005 MAT source records were not reexecuted in CI.'
