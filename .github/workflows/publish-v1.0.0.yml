name: Publish v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
            exit 0
          fi

          gh release create v1.0.0 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.0 — Presubmission reproducibility archive" \
            --notes "Frozen presubmission reproducibility archive for 'Prescribed Force Trajectories as Benchmarks for Longitudinal EMG Decoding'. Single author: Antonio Pereira. Includes the executable temporal-prior benchmark, fixed analysis specification, recovered plotting provenance, and frozen numerical summaries."
